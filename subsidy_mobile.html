<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>補助金・助成金 概要検索</title>
<style>
:root{
  --g:#0A5C40;--gd:#073F2C;--gl:#E8F5EE;--gm:#18B876;
  --b:#1353A8;--bl:#EBF2FF;
  --a:#7A3310;--al:#FEF0DC;
  --r:#991B1B;
  --n50:#F9FAFB;--n100:#F3F4F6;--n200:#E5E7EB;--n300:#D1D5DB;
  --n400:#9CA3AF;--n500:#6B7280;--n600:#4B5563;--n700:#374151;--n800:#1F2937;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#F0F4F8}
body{
  font-family:'Hiragino Sans',Meiryo,system-ui,sans-serif;
  font-size:14px;color:var(--n800);
  min-height:100vh;background:#F0F4F8;
  -webkit-font-smoothing:antialiased;
}

/* ── ヘッダー ── */
.hdr{
  position:sticky;top:0;z-index:100;
  background:var(--g);
  padding:12px 16px 10px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.hdr-title{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.7);margin-top:2px}
#gemini-key::placeholder{color:var(--n300)}
#gemini-key:focus{border-color:var(--g);background:#fff}
.hdr-step{
  display:flex;gap:6px;margin-top:10px;
}
.step-btn{
  flex:1;padding:8px 4px;font-size:11px;font-weight:600;
  border:none;border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.15);color:rgba(255,255,255,.75);
  transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.step-btn.active{background:#fff;color:var(--g);}
.step-btn .snum{
  width:18px;height:18px;border-radius:50%;
  background:var(--g);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;flex-shrink:0;
}
.step-btn.active .snum{background:var(--g);}

/* ── メインコンテンツ ── */
.main{padding:12px 12px 100px}

/* ── パネル ── */
.panel{display:none}
.panel.active{display:block}

/* ── セクションタイトル ── */
.sec-title{
  font-size:12px;font-weight:700;color:var(--n600);
  letter-spacing:.05em;text-transform:uppercase;
  margin-bottom:8px;display:flex;align-items:center;gap:5px;
}

/* ── 省庁グリッド ── */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.mcard{
  border:2px solid var(--n200);border-radius:10px;
  padding:10px 8px;cursor:pointer;
  background:#fff;transition:all .14s;
  display:flex;align-items:center;gap:8px;
  -webkit-user-select:none;user-select:none;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.mcard:active{transform:scale(.97)}
.mcard.on{background:var(--gl);border-color:var(--gm);}
.mico{font-size:20px;flex-shrink:0}
.mbody{flex:1;min-width:0}
.mname{font-size:11px;font-weight:700;color:var(--n700);line-height:1.3}
.mcard.on .mname{color:var(--gd)}
.mcnt{font-size:9px;font-weight:600;color:var(--gm);margin-top:1px}
.mcard:not(.on) .mcnt{color:var(--n400)}

/* ── panel-2 タブ切り替え ── */
function swP2(tab){
  var isList = (tab === 'list');
  var listEl  = document.getElementById('p2-list');
  var areaEl  = document.getElementById('p2-area');
  var footer  = document.getElementById('sel-footer-wrap');
  var listBtn = document.getElementById('p2tab-list');
  var areaBtn = document.getElementById('p2tab-area');

  if(listEl) listEl.style.display = isList ? 'block' : 'none';
  if(areaEl) areaEl.style.display = isList ? 'none'  : 'block';
  /* フッターはリストタブのみ表示 */
  if(footer)  footer.style.display = isList ? 'block' : 'none';

  if(listBtn){
    listBtn.style.color             = isList ? 'var(--g)'    : 'var(--n400)';
    listBtn.style.borderBottomColor = isList ? 'var(--g)'    : 'transparent';
    listBtn.style.fontWeight        = isList ? '700'         : '600';
  }
  if(areaBtn){
    areaBtn.style.color             = isList ? 'var(--n400)' : 'var(--g)';
    areaBtn.style.borderBottomColor = isList ? 'transparent' : 'var(--g)';
    areaBtn.style.fontWeight        = isList ? '600'         : '700';
  }
}

/* ── 地域検索：Perplexityにプロンプトを投げる ── */
function openAreaSearch(){
  var pref = document.getElementById('area-pref').value.trim();
  if(!pref){ alert('都道府県を入力してください'); return; }
  var city = document.getElementById('area-city').value.trim();
  var region = city ? pref + city : pref;

  /* 選択された対象種別 */
  var types = [];
  document.querySelectorAll('#area-types .cp.on').forEach(function(b){ types.push(b.getAttribute('data-v')); });
  if(types.length === 0){ alert('対象を1つ以上選択してください'); return; }

  /* 選択された対象事業者 */
  var bizList = [];
  document.querySelectorAll('#area-biz .cp.on').forEach(function(b){ bizList.push(b.getAttribute('data-v')); });

  var typeStr = types.join('・');
  var bizStr  = bizList.length > 0 ? bizList.join('・') : '制限なし';

  /* プロンプト構築 */
  var query =
    region + 'で利用できる' + typeStr + 'の一覧を教えてください。

'
    + '【条件】
'
    + '・対象地域：' + region + 'が主体の制度（国の制度は除く）
'
    + '・種別：' + typeStr + '
'
    + '・対象事業者：' + bizStr + '
'
    + '・2026年（令和8年）現在 募集中または近日公募予定の制度を優先
'
    + '・終了・廃止済みの制度は除く

'
    + '【出力形式】
'
    + '各制度について以下の項目を一覧表形式でまとめてください：
'
    + '① 制度名
'
    + '② 実施主体（県・市町村名）
'
    + '③ 概要（1〜2行）
'
    + '④ 対象者
'
    + '⑤ 補助率・補助上限（または融資限度額）
'
    + '⑥ 申請期限
'
    + '⑦ 問い合わせ先・URL

'
    + '【注意】公式情報を根拠とすること。不明な項目は「要確認」と記載。';

  var url = 'https://www.perplexity.ai/search?q=' + encodeURIComponent(query);
  var a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 100);

  /* ③内容確認パネルに検索内容を記録 */
  document.getElementById('result-title').textContent = '内容確認（地域検索）';
  document.getElementById('result-sub').textContent   = region + ' の' + typeStr + 'を検索しました';
  var area3 = document.getElementById('result-area');
  area3.innerHTML =
    '<div style="background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);padding:14px;margin-bottom:10px">'
    + '<div style="font-size:11px;font-weight:700;color:var(--gd);margin-bottom:8px">🗾 地域検索の内容</div>'
    + '<div style="font-size:12px;color:var(--n700);line-height:2">'
    + '<b>地域：</b>' + esc(region) + '<br>'
    + '<b>種別：</b>' + esc(typeStr) + '<br>'
    + '<b>対象事業者：</b>' + esc(bizStr)
    + '</div></div>'
    + '<div style="background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden;margin-bottom:10px">'
    + '<button onclick="var b=this.nextElementSibling;var a=this.querySelector('span');b.style.display=b.style.display==='none'?'block':'none';a.textContent=b.style.display==='none'?'▼':'▲'" '
    + 'style="width:100%;padding:12px 14px;background:#fff;border:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--n700)">'
    + '<span style="pointer-events:none">📝 検索プロンプトを確認</span><span style="font-size:12px;color:var(--n400)">▼</span></button>'
    + '<div style="display:none;padding:10px 14px 14px;border-top:1px solid var(--n200)">'
    + '<pre style="font-size:9.5px;color:var(--n600);line-height:1.8;white-space:pre-wrap;word-break:break-all;background:var(--n50);border-radius:7px;padding:10px">'
    + esc(query) + '</pre>'
    + '<button onclick="navigator.clipboard.writeText(' + JSON.stringify(query) + ').then(function(){alert('コピーしました')})" '
    + 'style="display:flex;align-items:center;gap:5px;width:100%;padding:9px;background:#fff;color:var(--n600);border:1.5px solid var(--n300);border-radius:9px;font-size:11px;font-weight:600;cursor:pointer;margin-top:7px;justify-content:center">'
    + '📋 プロンプトをコピー</button>'
    + '</div></div>'
    + '<div style="background:#EFF6FF;border-radius:10px;padding:10px 13px;font-size:11px;color:var(--b);line-height:1.9">'
    + '💡 Perplexityの結果を確認後、気になる制度は公式サイトで詳細を確認してください。</div>';
}

/* ── カテゴリピル ── */
.cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.cpg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.cp{
  padding:5px 11px;font-size:12px;
  border:1.5px solid var(--n300);border-radius:14px;
  cursor:pointer;background:#fff;color:var(--n600);
  transition:all .12s;-webkit-user-select:none;user-select:none;
  font-weight:500;
}
.cp:active{transform:scale(.95)}
.cp.on{background:var(--gl);border-color:var(--gm);color:var(--gd);font-weight:700}
.ctrl-btns{display:flex;gap:5px}
.ctrl-btn{
  padding:4px 10px;font-size:10px;font-weight:600;
  border:1px solid var(--n300);border-radius:7px;
  background:#fff;color:var(--n600);cursor:pointer;
}
.ctrl-btn.danger{border-color:#FECACA;color:var(--r);background:var(--rl) }

/* ── 補助金テーブル ── */
.search-box{
  display:flex;gap:7px;margin-bottom:8px;
}
.sinp{
  flex:1;padding:10px 12px;font-size:14px;
  border:1.5px solid var(--n300);border-radius:10px;
  background:#fff;color:var(--n800);outline:none;
  -webkit-appearance:none;
}
.sinp:focus{border-color:var(--g)}
.clr-btn{
  padding:10px 12px;font-size:12px;font-weight:600;
  border:1.5px solid var(--n300);border-radius:10px;
  background:#fff;color:var(--n500);cursor:pointer;white-space:nowrap;
}
.sub-count{font-size:11px;color:var(--n400);text-align:right;margin-bottom:6px}

/* 補助金リスト */
.sub-list{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.sub-item{
  background:#fff;border:1.5px solid var(--n200);border-radius:10px;
  padding:10px 12px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:all .13s;box-shadow:0 1px 3px rgba(0,0,0,.05);
  -webkit-user-select:none;user-select:none;
}
.sub-item:active{transform:scale(.99)}
.sub-item.sel{background:var(--gl);border-color:var(--gm)}
.sub-info{flex:1;min-width:0}
.sub-name{font-size:12px;font-weight:600;color:var(--n800);line-height:1.4;word-break:break-all}
.sub-item.sel .sub-name{color:var(--gd)}
.sub-meta{font-size:10px;color:var(--n400);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.sub-badge{
  font-size:9px;padding:1px 6px;border-radius:4px;font-weight:600;
  white-space:nowrap;display:inline-block;flex-shrink:0;align-self:flex-start;margin-top:1px;
}
.chk{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--n300);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .13s;background:#fff;
}
.sub-item.sel .chk{background:var(--g);border-color:var(--g)}
.chk svg{opacity:0;transition:opacity .13s}
.sub-item.sel .chk svg{opacity:1}

/* ── 選択済みリスト（スティッキーフッター） ── */
.sel-footer{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1.5px solid var(--n200);
  padding:10px 12px calc(10px + var(--safe-bottom));
  box-shadow:0 -4px 16px rgba(0,0,0,.1);
  z-index:50;
}
.sel-footer-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:7px;
}
.sel-footer-title{font-size:12px;font-weight:700;color:var(--n700)}
.sel-cnt{
  font-size:11px;font-weight:700;padding:2px 9px;
  border-radius:9px;background:var(--gl);color:var(--g);
}
.sel-cnt.warn{background:#FEF3C7;color:#92400E}
.sel-cnt.mx{background:#FEF2F2;color:var(--r)}
.sel-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;min-height:24px}
.sel-tag{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--gl);border:1px solid var(--gm);
  border-radius:12px;padding:3px 8px 3px 6px;
  font-size:10px;color:var(--gd);
}
.stn{
  width:14px;height:14px;border-radius:50%;
  background:var(--g);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;flex-shrink:0;
}
.std{
  background:none;border:none;cursor:pointer;
  color:var(--gd);font-size:14px;line-height:1;padding:0;
}
.search-btn{
  width:100%;padding:13px;font-size:14px;font-weight:700;
  background:var(--g);color:#fff;border:none;border-radius:11px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .14s;-webkit-user-select:none;user-select:none;
}
.search-btn:active{background:var(--gd);transform:scale(.99)}
.search-btn:disabled{background:var(--n300);color:var(--n400);cursor:not-allowed}
.lim-warn{
  font-size:10px;color:var(--a);background:var(--al);
  border:1px solid #FCD34D;border-radius:6px;
  padding:4px 9px;margin-bottom:6px;
  display:flex;align-items:center;gap:4px;
}

/* ── 結果パネル ── */
.result-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:6px;
}
.result-title{font-size:14px;font-weight:700;color:var(--n800)}
.result-sub{font-size:11px;color:var(--n500);margin-top:2px}
.back-btn{
  padding:7px 14px;font-size:12px;font-weight:600;
  border:1.5px solid var(--n300);border-radius:9px;
  background:#fff;color:var(--n600);cursor:pointer;
  display:flex;align-items:center;gap:5px;
}

/* ── ローディング ── */
.loading{
  text-align:center;padding:48px 24px;
}
.spinner{
  width:40px;height:40px;border-radius:50%;
  border:3px solid var(--gl);border-top-color:var(--g);
  animation:spin .8s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--n500);line-height:1.8}
.loading-name{
  font-size:11px;font-weight:600;color:var(--g);
  background:var(--gl);border-radius:6px;padding:3px 10px;
  display:inline-block;margin-top:6px;max-width:240px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── 結果カード ── */
.result-cards{display:flex;flex-direction:column;gap:14px}
.rcard{
  background:#fff;border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  overflow:hidden;
}
.rcard-header{
  background:linear-gradient(135deg,var(--gd),#1A9E6A);
  padding:12px 14px;
}
.rcard-num{
  font-size:10px;font-weight:700;color:rgba(255,255,255,.75);
  margin-bottom:3px;
}
.rcard-name{font-size:14px;font-weight:700;color:#fff;line-height:1.4}
.rcard-summary{
  font-size:11px;color:rgba(255,255,255,.85);
  margin-top:4px;line-height:1.5;
}
.rcard-body{padding:12px 14px;display:flex;flex-direction:column;gap:0}
.rfield{
  display:flex;padding:8px 0;
  border-bottom:1px solid var(--n100);
}
.rfield:last-child{border-bottom:none;padding-bottom:0}
.rfield-label{
  font-size:10px;font-weight:700;color:var(--n400);
  letter-spacing:.04em;white-space:nowrap;
  width:72px;flex-shrink:0;padding-top:1px;
}
.rfield-val{font-size:12px;color:var(--n700);line-height:1.65;flex:1;min-width:0;word-break:break-all}
.rfield-val.highlight{
  font-weight:700;color:var(--g);font-size:13px;
}
.error-card{
  background:#fff;border-radius:14px;padding:20px 16px;
  border:1.5px solid #FECACA;text-align:center;
}
.error-icon{font-size:32px;margin-bottom:8px}
.error-msg{font-size:13px;color:var(--r);line-height:1.6}

/* ── 空状態 ── */
.empty-state{
  text-align:center;padding:48px 24px;
}
.empty-icon{font-size:56px;opacity:.25;margin-bottom:14px}
.empty-title{font-size:15px;font-weight:700;color:var(--n500);margin-bottom:8px}
.empty-desc{font-size:12px;color:var(--n400);line-height:1.8}

/* アニメーション */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="hdr">
  <div class="hdr-title">🏛 補助金・助成金 概要検索 <span style="font-size:10px;font-weight:500;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:8px;margin-left:4px">Perplexity</span></div>
  <div class="hdr-sub">Perplexity Pro で最新情報を検索します</div>

  <div class="hdr-step">
    <button class="step-btn active" id="step1-btn" onclick="goStep(1)">
      <span class="snum">1</span>カテゴリ
    </button>
    <button class="step-btn" id="step2-btn" onclick="goStep(2)">
      <span class="snum">2</span>補助金選択
    </button>
    <button class="step-btn" id="step3-btn" onclick="goStep(3)">
      <span class="snum">3</span>内容確認
    </button>
  </div>
</div>

<div class="main">

  <!-- ══ STEP 1: カテゴリ ══ -->
  <div class="panel active" id="panel-1">



    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
      <div class="sec-title" style="margin-bottom:0">🏛 省庁を選択（複数可）</div>
      <div class="ctrl-btns">
        <button class="ctrl-btn" onclick="selAllMin()">すべて選択</button>
        <button class="ctrl-btn danger" onclick="clearAllMin()">すべて解除</button>
      </div>
    </div>
    <div class="mgrid" id="mgrid"></div>

    <div class="cat-header">
      <div class="sec-title" style="margin-bottom:0">📂 カテゴリで絞り込み</div>
      <div class="ctrl-btns">
        <button class="ctrl-btn" onclick="selAllCat()">すべて選択</button>
        <button class="ctrl-btn danger" onclick="clearAllCat()">すべて解除</button>
      </div>
    </div>
    <div class="cpg" id="catpills"></div>

    <!-- 次へボタン -->
    <button class="search-btn" onclick="goStep(2)" style="margin-top:4px">
      補助金を選ぶ
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

  </div>

  <!-- ══ STEP 2: 補助金選択 ══ -->
  <div class="panel" id="panel-2">

    <!-- ── タブ切り替え ── -->
    <div style="display:flex;border-bottom:2px solid var(--n200);margin-bottom:10px;background:#fff;position:sticky;top:0;z-index:10">
      <button class="p2-tab on" id="p2tab-list" onclick="swP2('list')"
        style="flex:1;padding:10px 4px;font-size:12px;font-weight:600;border:none;background:none;cursor:pointer;color:var(--g);border-bottom:2.5px solid var(--g);margin-bottom:-2px">
        📋 補助金を選ぶ

/* ── 省庁グリッド ── */
function buildMGrid(){
  var g=document.getElementById('mgrid');g.innerHTML='';
  MINS.forEach(function(m){
    var cnt=DB.filter(function(s){return s.min===m.k;}).length;
    var d=document.createElement('div');d.className='mcard';d.setAttribute('data-k',m.k);
    d.innerHTML='<div class="mico">'+m.i+'</div>'
      +'<div class="mbody"><div class="mname">'+m.n+'</div>'
      +'<div style="font-size:9px;color:var(--n400);line-height:1.3;margin-top:1px">'+m.sub+'</div>'
      +'<div class="mcnt">'+cnt+'件</div></div>';
    d.onclick=function(){
      d.classList.toggle('on');
      actMins=[];
      document.querySelectorAll('#mgrid .mcard.on').forEach(function(c){actMins.push(c.getAttribute('data-k'));});
      buildCatPills();buildSubList();
    };
    g.appendChild(d);
  });
}

/* ── カテゴリピル ── */
function buildCatPills(){
  var filtered=actMins.length>0?DB.filter(function(s){return actMins.indexOf(s.min)>=0;}):DB;
  var cats=[...new Set(filtered.map(function(s){return s.cat;}))].sort();
  var g=document.getElementById('catpills');g.innerHTML='';
  cats.forEach(function(cat){
    var on=actCats.length===0||actCats.indexOf(cat)>=0;
    var p=document.createElement('button');
    p.className='cp'+(on?' on':'');p.setAttribute('data-v',cat);p.textContent=cat;
    p.onclick=function(){
      p.classList.toggle('on');
      actCats=[];
      document.querySelectorAll('#catpills .cp.on').forEach(function(b){actCats.push(b.getAttribute('data-v'));});
      buildSubList();
    };
    g.appendChild(p);
  });
}
function selAllCat(){actCats=[];document.querySelectorAll('#catpills .cp').forEach(function(p){p.classList.add('on');});buildSubList();}
function clearAllCat(){actCats=[];document.querySelectorAll('#catpills .cp').forEach(function(p){p.classList.remove('on');});buildSubList();}

/* ── 補助金リスト ── */
function filtSub(){buildSubList();}
function buildSubList(){
  var kw=(document.getElementById('sch').value||'').trim().toLowerCase();
  var allOn=document.querySelectorAll('#catpills .cp.on').length;
  var filtered=DB.filter(function(s){
    if(actMins.length>0&&actMins.indexOf(s.min)<0)return false;
    if(allOn===0)return false;
    if(actCats.length>0&&actCats.indexOf(s.cat)<0)return false;
    if(kw&&s.name.toLowerCase().indexOf(kw)<0&&s.min.toLowerCase().indexOf(kw)<0)return false;
    return true;
  });
  var mc={},mb={};
  MINS.forEach(function(m){mc[m.k]=m.c;mb[m.k]=m.bg;});
  var g=document.getElementById('sub-list');g.innerHTML='';
  filtered.forEach(function(s){
    var isSel=selList.some(function(x){return x.id===s.id;});
    var d=document.createElement('div');
    d.className='sub-item'+(isSel?' sel':'');
    d.onclick=function(){togSel(s.id);};
    var c=mc[s.min]||'#444';var bg=mb[s.min]||'#F3F4F6';
    d.innerHTML='<div class="sub-info">'
      +'<div class="sub-name">'+s.name+'</div>'
      +'<div class="sub-meta">'
      +'<span class="sub-badge" style="background:'+bg+';color:'+c+'">'+s.min+'</span>'
      +'<span style="font-size:9px;color:var(--n400)">'+s.cat+'</span>'
      +(s.end&&s.end!=='未定'?'<span style="font-size:9px;color:var(--n400)">〆'+s.end+'</span>':'')
      +'</div>'
      +'</div>'
      +'<div class="chk">'
      +'<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M2 8l4 4 8-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      +'</div>';
    g.appendChild(d);
  });
  document.getElementById('sub-count').textContent=filtered.length+'件表示';
}

/* ── 選択操作 ── */
function togSel(id){
  var s=DB.find(function(x){return x.id===id;});if(!s)return;
  var idx=selList.findIndex(function(x){return x.id===id;});
  if(idx<0){
    if(selList.length>=MAX){document.getElementById('lim-warn').style.display='flex';return;}
    selList.push(s);
  } else {
    selList.splice(idx,1);
    document.getElementById('lim-warn').style.display='none';
  }
  buildSubList();renderSelFooter();
}
function removeSel(id){
  selList=selList.filter(function(x){return x.id!==id;});
  document.getElementById('lim-warn').style.display='none';
  buildSubList();renderSelFooter();
}

  var n=selList.length;

/* ══ ステップ切り替え ══ */
function goStep(n){
  curStep=n;
  [1,2,3].forEach(function(i){
    document.getElementById('panel-'+i).classList.toggle('active',i===n);
    document.getElementById('step'+i+'-btn').classList.toggle('active',i===n);
  });
  window.scrollTo(0,0);

    swP2('list');

/* ══ AI検索実行 ══ */
/* 検索ボタン押下：プロンプトを生成してそのままPerplexityを開く */
function openPerplexity(){
  if(selList.length===0)return;
  buildPxQuery();
  /* 隠しaタグ経由で開く（window.openによるabout:blank防止） */
  var url = 'https://www.perplexity.ai/search?q=' + encodeURIComponent(window._currentPxQuery);
  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 100);
  updateResultPanel();
}

function buildPxQuery(){
  var isSingle = selList.length === 1;
  var nameList = selList.map(function(s){ return s.name; }).join('、');

  /* 補助金リスト部分（毎回更新） */
  var newHeader = isSingle
    ? '【' + nameList + '】について2026年（令和8年）最新情報を以下の形式でまとめてください。'
    : '以下の補助金を比較してください。\n\n【対象】\n'
      + selList.map(function(s,i){ return (i+1)+'. '+s.name; }).join('\n');

  var newTableHeader = isSingle ? '' :
    '\n| 項目 | ' + selList.map(function(s){
      return s.name.length>15 ? s.name.substring(0,15)+'\u2026' : s.name;
    }).join(' | ') + ' |\n'
    + '| --- | ' + selList.map(function(){ return '---'; }).join(' | ') + ' |\n'
    + '| 概要 | ... |\n| 補助率・上限 | ... |\n| 申請期限 | ... |\n| 対象者 | ... |';

  /* BODY部分：localStorageに保存済みがあればそれを使用（ユーザー編集を維持） */
  var savedBody = localStorage.getItem('px_prompt_body');

  var finalQuery;
  if(savedBody){
    /* ヘッダー（補助金リスト）だけ差し替え、BODYは保存済みを維持 */
    finalQuery = newHeader
      + (isSingle ? '' : '\n\n' + newTableHeader)
      + '\n\n' + savedBody;
  } else {
    /* 初回：デフォルトBODYを生成してlocalStorageに保存 */
    /* 出力項目（1件・複数件共通）: 概要→申請開始日→申請期限→対象経費→補助率・上限額→対象者→要件等→申請方法 */
    var ITEMS = [
      '① 概要（2〜3行で端的に）',
      '② 申請開始日（例：2026年4月1日。未定の場合はその旨）',
      '③ 申請期限（例：2026年8月29日。随時受付の場合はその旨）',
      '④ 対象経費（補助対象となる設備・経費の主なもの）',
      '⑤ 補助率・補助上限額（例：2/3以内、上限1,000万円。正確に記載）',
      '⑥ 対象者（業種・規模・要件）',
      '⑦ 要件等（申請・採択に必要な主な条件を箇条書き3点以内）',
      '⑧ 申請方法（電子申請・郵送など。主な窓口・URLも記載）',
    ];
    var itemStr = ITEMS.map(function(t){ return '## ' + t; }).join('\n');
    var condition = '\n\n【条件】2026年（令和8年）最新公募回の公式情報を根拠とすること。'
      + '不明・未公表の項目は「要確認（公式サイト参照）」と記載。各項目は簡潔にまとめること。';

    /* 比較表ヘッダー（複数件時） */
    var multiTable = newTableHeader
      .replace('| 概要 | ... |', '| 概要 | ... |')
      .replace('| 補助率・上限 | ... |', '| 補助率・上限額 | ... |')
      .replace('| 申請期限 | ... |', '| 申請期限 | ... |')
      .replace('| 対象者 | ... |', '| 対象者 | ... |');

    var defaultBody = isSingle
      ? itemStr + condition
      : '## STEP1：概要比較表\n各補助金を下記の項目で比較表にまとめてください。\n'
        + '| 項目 | ' + selList.map(function(s){
            return s.name.length>15 ? s.name.substring(0,15)+'\u2026' : s.name;
          }).join(' | ') + ' |\n'
        + '| --- | ' + selList.map(function(){ return '---'; }).join(' | ') + ' |\n'
        + '| 概要 | ... |\n'
        + '| 申請開始日 | ... |\n'
        + '| 申請期限 | ... |\n'
        + '| 補助率・上限額 | ... |\n'
        + '| 対象者 | ... |\n\n'
        + '## STEP2：各補助金の詳細\n'
        + ITEMS.map(function(t){ return '- ' + t; }).join('\n') + '\n'
        + condition;
    localStorage.setItem('px_prompt_body', defaultBody);
    finalQuery = newHeader
      + (isSingle ? '\n\n' : '\n\n' + newTableHeader + '\n\n')
      + defaultBody;
  }
  window._currentPxQuery = finalQuery;
  window._isSingle = isSingle;
}

function updateResultPanel(){
  var finalQuery = window._currentPxQuery || '';
  var isSingle = window._isSingle;
  document.getElementById('result-title').textContent = isSingle ? '内容確認' : '内容確認（'+selList.length+'件）';
  document.getElementById('result-sub').textContent = 'プロンプトの確認・編集ができます';
  var area = document.getElementById('result-area');
  area.innerHTML = '';

  /* 対象補助金リスト */
  var lc = document.createElement('div');
  lc.style.cssText = 'background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:10px;overflow:hidden';
  var lh = document.createElement('div');
  lh.style.cssText = 'padding:9px 14px;background:var(--gl);border-bottom:1px solid var(--n200);font-size:11px;font-weight:700;color:var(--gd)';
  lh.textContent = '📋 検索済み（'+selList.length+'件）';
  lc.appendChild(lh);
  selList.forEach(function(s,i){
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--n100)';
    row.innerHTML='<span style="width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0">'+(i+1)+'</span>'
      +'<span style="font-size:12px;color:var(--n800);line-height:1.4;flex:1">'+esc(s.name)+'</span>';
    lc.appendChild(row);
  });
  area.appendChild(lc);

  /* プロンプト確認・編集（折りたたみ） */
  var dw=document.createElement('div');
  dw.style.cssText='background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:10px;overflow:hidden';
  var dh=document.createElement('button');
  dh.style.cssText='width:100%;padding:12px 14px;background:#fff;border:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--n700)';
  dh.innerHTML='<span>📝 プロンプトを確認・編集</span><span id="detail-arrow" style="font-size:12px;color:var(--n400)">▼</span>';
  var db=document.createElement('div');
  db.style.cssText='display:none;padding:0 12px 12px;border-top:1px solid var(--n200)';
  var ta=document.createElement('textarea');
  ta.id='px-prompt-edit';
  ta.style.cssText='width:100%;min-height:180px;background:var(--n50);border:1px solid var(--n300);border-radius:8px;padding:10px 11px;font-size:10.5px;color:var(--n700);line-height:1.8;resize:vertical;outline:none;font-family:inherit;-webkit-appearance:none;margin-top:10px';
  ta.value=finalQuery;
  ta.oninput=function(){
    /* 編集内容をlocalStorageに保存（補助金リスト以外の部分を固定化） */
    var val=ta.value;
    /* 最初の空行以降をBODYとして保存 */
    var bodyStart=val.indexOf('\n\n');
    if(bodyStart>=0){
      /* 2つ目の空行以降（条件・形式部分）をBODYとして保存 */
      var secondBreak=val.indexOf('\n\n',bodyStart+2);
      var body=secondBreak>=0?val.substring(secondBreak+2):val.substring(bodyStart+2);
      if(body.trim()) localStorage.setItem('px_prompt_body',body);
    }
    window._currentPxQuery=val;
  };
  db.appendChild(ta);

  /* 再検索ボタン */
  var rb=document.createElement('button');
  rb.style.cssText='display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-top:8px;-webkit-user-select:none';
  rb.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>編集内容で再検索';
  rb.onclick=function(){
    var url='https://www.perplexity.ai/search?q='+encodeURIComponent(ta.value);
    var a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener noreferrer'; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); },100);
  };
  db.appendChild(rb);

  /* コピーボタン */
  var cb=document.createElement('button');
  cb.style.cssText='display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:9px;background:#fff;color:var(--n600);border:1.5px solid var(--n300);border-radius:9px;font-size:11px;font-weight:600;cursor:pointer;margin-top:7px';
  cb.innerHTML='📋 プロンプトをコピー';
  cb.onclick=function(){
    navigator.clipboard.writeText(ta.value).then(function(){
      cb.textContent='✓ コピーしました';
      setTimeout(function(){ cb.innerHTML='📋 プロンプトをコピー'; },2000);
    });
  };
  db.appendChild(cb);
  dw.appendChild(dh);dw.appendChild(db);
  dh.onclick=function(){
    var open=db.style.display==='none';
    db.style.display=open?'block':'none';
    document.getElementById('detail-arrow').textContent=open?'▲':'▼';
  };
  area.appendChild(dw);

  /* ヒント */
  var hint=document.createElement('div');
  hint.style.cssText='background:#EFF6FF;border-radius:10px;padding:10px 13px;font-size:11px;color:var(--b);line-height:1.9';
  hint.innerHTML='<b>💡 ヒント</b><br>プロンプトを編集して「編集内容で再検索」で<br>条件を変えて再検索できます';
  area.appendChild(hint);
}


function renderResults(results){
  document.getElementById('result-title').textContent='検索結果';
  document.getElementById('result-sub').textContent=results.length+'件の概要を取得しました';

  var area=document.getElementById('result-area');
  area.innerHTML='';

  /* ── 1件の場合はカード形式、2件以上は比較表形式 ── */
  if(results.length===1){
    renderCards(results, area);
  } else {
    renderTable(results, area);
    /* 表の下に詳細カードも表示 */
    var divider=document.createElement('div');
    divider.style.cssText='font-size:12px;font-weight:700;color:var(--n600);margin:16px 0 8px;padding-left:2px';
    divider.textContent='▼ 各補助金の詳細';
    area.appendChild(divider);
    renderCards(results, area);
  }
}

/* ── 比較表 ── */
function renderTable(results, area){
  var FIELDS=[
    {key:'summary',  label:'概要'},
    {key:'target',   label:'対象者'},
    {key:'rate',     label:'補助率・上限', highlight:true},
    {key:'deadline', label:'申請期限',     highlight:true},
    {key:'requirement',label:'補助要件'},
    {key:'equipment',label:'対象設備'},
    {key:'documents',label:'必要書類'},
  ];

  var wrap=document.createElement('div');
  wrap.className='fade-in';
  wrap.style.cssText='overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:4px';

  var colW=Math.max(130, Math.floor((window.innerWidth-24)/(results.length+1)));
  var tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;font-size:11px;min-width:'+(colW*(results.length+1))+'px';

  /* ヘッダー行（補助金名） */
  var thead=document.createElement('thead');
  var hrow=document.createElement('tr');
  /* 項目ラベル列 */
  var th0=document.createElement('th');
  th0.style.cssText='padding:8px 6px;background:var(--g);color:#fff;font-size:10px;font-weight:700;text-align:left;position:sticky;left:0;z-index:2;min-width:68px;border-right:1px solid rgba(255,255,255,.2)';
  th0.textContent='項目';
  hrow.appendChild(th0);
  results.forEach(function(r,i){
    var th=document.createElement('th');
    th.style.cssText='padding:8px 7px;background:var(--g);color:#fff;font-size:10px;font-weight:700;text-align:left;min-width:'+colW+'px;line-height:1.4;border-left:1px solid rgba(255,255,255,.2)';
    th.innerHTML='<span style="font-size:8px;opacity:.75;display:block;margin-bottom:2px">'+(i+1)+'</span>'+esc(r.name||'');
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  tbl.appendChild(thead);

  /* データ行 */
  var tbody=document.createElement('tbody');
  FIELDS.forEach(function(f,fi){
    var tr=document.createElement('tr');
    var bg=fi%2===0?'#fff':'var(--n50)';
    /* ラベルセル */
    var td0=document.createElement('td');
    td0.style.cssText='padding:8px 6px;background:var(--gl);font-size:9.5px;font-weight:700;color:var(--gd);position:sticky;left:0;z-index:1;border-right:1px solid var(--n200);vertical-align:top;line-height:1.4';
    td0.textContent=f.label;
    tr.appendChild(td0);
    results.forEach(function(r){
      var td=document.createElement('td');
      var val=r[f.key]||'—';
      td.style.cssText='padding:8px 7px;background:'+bg+';vertical-align:top;line-height:1.6;border-left:1px solid var(--n200);word-break:break-all';
      if(f.highlight) td.style.fontWeight='700';
      if(f.highlight) td.style.color='var(--g)';
      /* 必要書類は改行して表示 */
      if(f.key==='documents'){
        td.innerHTML=val.split('・').join('<br>・').split('\n').join('<br>').replace(/^<br>/,'');//
      } else {
        td.textContent=val;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);

  /* 横スクロールヒント */
  if(results.length>=2){
    var hint=document.createElement('div');
    hint.style.cssText='font-size:9.5px;color:var(--n400);text-align:center;margin-top:4px;margin-bottom:8px';
    hint.textContent='← 横にスクロールできます →';
    wrap.appendChild(hint);
  }

  /* コピー・共有ボタン */
  var btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:8px;margin-top:8px;margin-bottom:4px';
  var copyBtn=document.createElement('button');
  copyBtn.style.cssText='flex:1;padding:10px;font-size:12px;font-weight:600;border:1.5px solid var(--n300);border-radius:10px;background:#fff;color:var(--n600);cursor:pointer';
  copyBtn.textContent='📋 テキストをコピー';
  copyBtn.onclick=function(){ copyResultText(results); };
  btns.appendChild(copyBtn);
  wrap.appendChild(btns);

  area.appendChild(wrap);
}

/* ── 詳細カード ── */
function renderCards(results, area){
  var cards=document.createElement('div');
  cards.className='result-cards fade-in';
  results.forEach(function(r,i){
    var card=document.createElement('div');
    card.className='rcard';
    card.innerHTML=
      '<div class="rcard-header">'
        +'<div class="rcard-num">'+(i+1)+' / '+results.length+'</div>'
        +'<div class="rcard-name">'+esc(r.name||'')+'</div>'
        +(r.summary?'<div class="rcard-summary">'+esc(r.summary)+'</div>':'')
      +'</div>'
      +'<div class="rcard-body">'
        +field('対象者',    r.target||'—')
        +field('補助要件',  r.requirement||'—')
        +field('対象設備',  r.equipment||'—')
        +field('補助率・上限', r.rate||'—', true)
        +field('申請期限',  r.deadline||'—', true)
        td.innerHTML=val.split('・').join('<br>・').replace(/^<br・/,'');
      +'</div>';
    cards.appendChild(card);
  });
  area.appendChild(cards);
}

function field(label,val,highlight,pre){
  return '<div class="rfield">'
    +'<div class="rfield-label">'+label+'</div>'
    +'<div class="rfield-val'+(highlight?' highlight':'')+(pre?' pre-wrap':'')+'" style="'+(pre?'white-space:pre-wrap':'')+'">'+esc(val)+'</div>'
    +'</div>';
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* テキストをクリップボードにコピー */
function copyResultText(results){
  var FIELDS=[
    {key:'name',     label:'補助金名'},
    {key:'summary',  label:'概要'},
    {key:'target',   label:'対象者'},
    {key:'rate',     label:'補助率・上限'},
    {key:'deadline', label:'申請期限'},
    {key:'requirement',label:'補助要件'},
    {key:'equipment',label:'対象設備'},
    {key:'documents',label:'必要書類'},
  ];
  var lines=[];
  results.forEach(function(r,i){
    lines.push('■ '+(i+1)+'. '+( r.name||''));
    FIELDS.slice(1).forEach(function(f){
      if(r[f.key]) lines.push('  '+f.label+'：'+r[f.key]);
    });
    lines.push('');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    alert('コピーしました');
  });
}

/* 初期フッターレンダリング */
renderSelFooter();

/* ── APIキーカード 開閉 ── */
function toggleKeyCard(){
  var area=document.getElementById('key-input-area');
  var btn=document.getElementById('key-toggle-card');
  var savedMsg=document.getElementById('key-saved-msg');
  if(area.style.display==='none'){
    area.style.display='block';
    if(savedMsg) savedMsg.style.display='none';
    btn.textContent='閉じる ▲';
  } else {
    area.style.display='none';
    if(savedMsg && localStorage.getItem('gmk')) savedMsg.style.display='block';
    btn.textContent='変更 ▼';
  }
}

/* ── APIキー管理 ── */
function saveKey(){
  var k=document.getElementById('gemini-key').value.trim();
  if(k){
    localStorage.setItem('gmk',k);
    document.getElementById('key-status').textContent='✓ APIキーを保存しました';
  } else {
    localStorage.removeItem('gmk');
    document.getElementById('key-status').textContent='';
  }
}
function toggleKeyVis(){
  var inp=document.getElementById('gemini-key');
  var btn=document.getElementById('key-vis-btn');
  if(inp.type==='password'){inp.type='text';btn.textContent='隠す';}
  else{inp.type='password';btn.textContent='表示';}
}
/* 保存済みキーを復元 */
(function(){
  var k=localStorage.getItem('gmk');
  var savedMsg=document.getElementById('key-saved-msg');
  var inputArea=document.getElementById('key-input-area');
  var toggleBtn=document.getElementById('key-toggle-card');
  if(k){
    document.getElementById('gemini-key').value=k;
    if(savedMsg) savedMsg.style.display='block';
    if(inputArea) inputArea.style.display='none';
    if(toggleBtn) toggleBtn.textContent='変更 ▼';
  } else {
    if(savedMsg) savedMsg.style.display='none';
    if(inputArea) inputArea.style.display='block';
    if(toggleBtn) toggleBtn.textContent='設定する ▲';
  }
})();
